[package]
name = "linkmesh-client"
version.workspace = true
edition.workspace = true

[[bin]]
name = "linkmesh-client"
path = "src/main.rs"

[dependencies]
linkmesh-shared = { path = "../linkmesh-shared" }
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
tokio.workspace = true
base64 = "0.22"
libc = "0.2"
tun = { version = "0.7", features = ["async"] }

[dev-dependencies]
linkmesh-shared = { path = "../linkmesh-shared" }
linkmesh-server = { path = "../linkmesh-server" }
tokio.workspace = true
base64 = "0.22"
